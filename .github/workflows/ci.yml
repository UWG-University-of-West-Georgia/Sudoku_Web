name: CI Pipeline

on:
  push:
    branches: [ "dev", "release" ]
  pull_request:
    branches: [ "dev", "release" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run build (if applicable)
      run: npm run build --if-present

    - name: Run tests
      run: npm test